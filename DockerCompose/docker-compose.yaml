services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
  backend:
    build: ./backend
    image: asierhr/catering-back:v2.1
    container_name: api-backend
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://192.168.1.139:5432/test
    networks:
       - app-network

  frontend:
    build: ./frontend
    image: asierhr/catering-frontend:v4
    container_name: frontend
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
