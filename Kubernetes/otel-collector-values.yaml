config:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317
    jaeger: null
    zipkin: null

  processors:
    batch: {}

  exporters:
    prometheus:
      endpoint: "0.0.0.0:9464"
      resource_to_telemetry_conversion:
        enabled: true
    debug:
      verbosity: detailed
    otlp/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls:
        insecure: true

  service:
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [prometheus]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug, otlp/tempo]
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.111.0

mode: deployment

ports:
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
  prometheus-app:
    enabled: true
    containerPort: 9464
    servicePort: 9464
