config:
  service:
    telemetry:
      metrics:
        readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
image:
  repository: otel/opentelemetry-collector-k8s
mode: deployment
ports:
  metrics:
    containerPort: 8888
    enabled: true
    protocol: TCP
    servicePort: 8888
