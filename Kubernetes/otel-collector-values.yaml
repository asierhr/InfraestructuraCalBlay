image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.111.0

mode: deployment

config:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25

    batch: {}

  connectors:
    spanmetrics:
      dimensions:
        - name: http.url
        - name: http.method
        - name: http.status_code

  exporters:
    otlp/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls:
        insecure: true

    prometheus:
      endpoint: 0.0.0.0:9464
      resource_to_telemetry_conversion:
        enabled: true

    debug:
      verbosity: detailed

  service:
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888

    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug, otlp/tempo, spanmetrics]

      metrics:
        receivers: [otlp, spanmetrics]
        processors: [batch]
        exporters: [prometheus]

ports:
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888

  prometheus:
    enabled: true
    containerPort: 9464
    servicePort: 9464
