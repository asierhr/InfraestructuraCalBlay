config:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317
  
  processors:
    batch: {}

  exporters:
    prometheus:
      endpoint: "0.0.0.0:9464"  # CAMBIADO: Antes era 8888
      resource_to_telemetry_conversion:
        enabled: true
    debug:
      verbosity: detailed

  service:
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888    # Telemetría interna se queda en 8888
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [prometheus]

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.111.0 

mode: deployment

ports:
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
  prometheus-app:       # AÑADIDO: Nuevo puerto para las métricas de tu app
    enabled: true
    containerPort: 9464
    servicePort: 9464
