apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.back.name }}-canary
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Values.back.name }}-app
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.back.name }}-app
